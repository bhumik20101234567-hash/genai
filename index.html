<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI | Instant Web Code Generator</title>
    <meta name="description" content="Search, provide your details, and instantly generate clean HTML/CSS web code with GenAI.">
    
    <script>
        // ⚠️ YOUR API KEY IS ALREADY SAVED RIGHT HERE:
        const GEMINI_API_KEY = "AQ.Ab8RN6KJiMNHR_06mXPdNtDAvwQ7cqj39m7_3bZantwaL4pilA";

        async function generateCode() {
            var siteType = document.getElementById('site-type').value.trim();
            var siteDetails = document.getElementById('site-details').value.trim();
            var btn = document.getElementById('genBtn');

            if (!siteType || !siteDetails) {
                alert("Please fill in both fields so GenAI can build your code!");
                return;
            }

            btn.innerText = "AI is thinking & coding... ⏳";
            btn.disabled = true;

            const prompt = `Create a complete, single-file HTML page with embedded CSS for a website about: "${siteType}". Additional details to include: "${siteDetails}". Return ONLY the raw HTML code inside your response. Do not include markdown wraps like \`\`\`html or any conversational text. Just start directly with <!DOCTYPE html>.`;

            try {
                // Completely fixed endpoint URL and header layouts for AQ keys
                const response = await fetch("https://googleapis.com", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "x-goog-api-key": GEMINI_API_KEY
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                if (!response.ok) {
                    throw new Error("Server returned status: " + response.status);
                }

                const data = await response.json();
                
                // Fixed JSON path target resolution
                let generatedHTML = data.candidates[0].content.parts[0].text;

                // Clean up any markdown code fences if the AI included them by accident
                generatedHTML = generatedHTML.replace(/```html/g, "").replace(/```/g, "").trim();

                document.getElementById('codeDisplay').innerText = generatedHTML;
                document.getElementById('outputSection').style.display = 'block';
                document.getElementById('copyBtn').innerText = "Copy Code";
                document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                console.error(error);
                alert("Error connecting to AI Engine. If testing locally, upload this file to GitHub Pages to bypass browser security locks.");
            } finally {
                btn.innerText = "Generate My Code ✨";
                btn.disabled = false;
            }
        }

        function toggleChat() {
            var chatBox = document.getElementById('chatBox');
            if (!chatBox) return;
            chatBox.style.display = (chatBox.style.display === 'flex') ? 'none' : 'flex';
        }

        function handleChatKey(event) {
            if (event.key === 'Enter') sendChatMessage();
        }

        function sendChatMessage() {
            var input = document.getElementById('chatInput');
            var messageText = input.value.trim();
            if (!messageText) return;

            var chatMessages = document.getElementById('chatMessages');
            var userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerText = messageText;
            chatMessages.appendChild(userDiv);
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            setTimeout(function() {
                var botDiv = document.createElement('div');
                botDiv.className = 'message bot';
                botDiv.innerText = "Thanks for your message! Our AI system is online. Go ahead and use the search fields above to generate real-time web code instantly.";
                chatMessages.appendChild(botDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 800);
        }

        function copyCode() {
            var codeText = document.getElementById('codeDisplay').innerText;
            navigator.clipboard.writeText(codeText).then(function() {
                document.getElementById('copyBtn').innerText = "Copied! ✓";
            });
        }
    </script>

    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #111827;
            --accent: #10b981;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 900px; margin: 40px auto; }
        header { text-align: center; margin-bottom: 40px; }
        h1 span { color: var(--accent); font-size: 3rem; font-weight: 800; }
        .subtitle { color: var(--text-muted); }
        .app-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="text"], textarea {
            width: 100%; background: #1f2937; border: 1px solid var(--border);
            border-radius: 6px; color: white; padding: 12px; font-size: 1rem;
        }
        button {
            width: 100%; background: var(--accent); color: #000; font-weight: 700;
            padding: 14px; border: none; border-radius: 6px; cursor: pointer;
        }
        button:disabled { background: #4b5563; cursor: not-allowed; }
        .output-box { margin-top: 30px; display: none; }
        .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .copy-btn { background: #374151; color: var(--text); padding: 6px 12px; width: auto; }
        pre { background: #030712; padding: 20px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); }
        code { color: #34d399; font-family: monospace; }
        
        .chat-launcher {
            position: fixed; bottom: 25px; right: 25px; background: var(--accent);
            color: black; width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; cursor: pointer; z-index: 1000;
        }
        .chat-box {
            position: fixed; bottom: 95px; right: 25px; width: 350px; height: 450px;
            background: #1f2937; border: 1px solid var(--border); border-radius: 12px;
            display: none; flex-direction: column; z-index: 1000; overflow: hidden;
        }
        .chat-header { background: var(--card-bg); padding: 15px; font-weight: bold; display: flex; justify-content: space-between; }
        .close-chat { cursor: pointer; color: var(--text-muted); }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 8px 12px; border-radius: 8px; max-width: 80%; font-size: 0.9rem; }
        .message.bot { background: #374151; align-self: flex-start; }
        .message.user { background: var(--accent); color: black; align-self: flex-end; }
        .chat-input-area { padding: 10px; background: var(--card-bg); display: flex; gap: 8px; border-top: 1px solid var(--border); }
        .chat-input-area input { flex: 1; background: #111827; border: 1px solid var(--border); padding: 8px; color: white; border-radius: 4px; }
        .chat-input-area button { width: auto; padding: 8px 15px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><span>GenAI</span> Code Engine</h1>
            <p class="subtitle">Tell us what you want to build, provide details, and get your custom code instantly.</p>
        </header>

        <main class="app-box">
            <div class="form-group">
                <label for="site-type">1. What kind of website do you want to build?</label>
                <input type="text" id="site-type" placeholder="e.g., Coffee Shop, Fitness Portfolio...">
            </div>

            <div class="form-group">
                <label for="site-details">2. Enter specific details (Colors, features, sections):</label>
                <textarea id="site-details" rows="4" placeholder="e.g., Dark blue theme, contact form..."></textarea>
            </div>

            <button id="genBtn" onclick="generateCode()">Generate My Code ✨</button>

            <div class="output-box" id="outputSection">
                <div class="output-header">
                    <h3>Generated HTML/CSS Code:</h3>
                    <button class="copy-btn" onclick="copyCode()" id="copyBtn">Copy Code</button>
                </div>
                <pre><code id="codeDisplay"></code></pre>
            </div>
        </main>
    </div>

    <div class="chat-launcher" onclick="toggleChat()">💬</div>
    
    <div class="chat-box" id="chatBox">
        <div class="chat-header">
            <span>GenAI Support Assistant</span>
            <span class="close-chat" onclick="toggleChat()">✕</span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">Hello! Welcome to GenAI. How can I help you build your website today?</div>
        </div>
        <div class="chat-input-area">
